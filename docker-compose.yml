services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: "no"
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecommerce
      # JWT_SECRET must be set in a .env file or the shell environment.
      # Fails fast if missing — don't silently fall back to a dev secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      CLIENT_URL: http://localhost:3000
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    # Run prisma generate before starting so the src bind-mount below doesn't wipe
    # the generated client baked into the image at build time.
    command: sh -c "npx prisma generate && npm run dev"
    volumes:
      - ./server/src:/app/src
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    volumes:
      - ./client/src:/app/src
    depends_on:
      - server

volumes:
  pgdata:
