services:
  db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Backs BullMQ for the Square Catalog sync job queue. Persistence on
    # ("appendonly yes") so a restart doesn't lose pending sync jobs — losing
    # one means a seller's listing edit never propagates to Square until the
    # nightly reconciliation catches it.
    image: redis:7-alpine
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      target: dev
    restart: "no"
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ecommerce
      # JWT_SECRET must be set in a .env file or the shell environment.
      # Fails fast if missing — don't silently fall back to a dev secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      CLIENT_URL: http://localhost:3000
      SMTP_HOST: sandbox.smtp.mailtrap.io
      SMTP_PORT: 2525
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      # Payments (Day 16b). Empty values are OK — each provider's /pay path
      # returns 503 if the corresponding provider isn't configured.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_ENV: ${SQUARE_ENV:-sandbox}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_WEBHOOK_URL: ${SQUARE_WEBHOOK_URL:-}
      # Catalog sync — pulled from a single demo merchant's Square account
      # (separate from per-seller OAuth) for the public Featured rail.
      SQUARE_FEATURED_ACCESS_TOKEN: ${SQUARE_FEATURED_ACCESS_TOKEN:-}
      SQUARE_FEATURED_LOCATION_ID: ${SQUARE_FEATURED_LOCATION_ID:-}
      # BullMQ + Redis. Empty REDIS_URL disables the catalog sync workers
      # gracefully — the toggles in the UI still appear, but sync jobs
      # are not enqueued, and the seller sees a "queue offline" message.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    # Run prisma generate before starting so the src bind-mount below doesn't wipe
    # the generated client baked into the image at build time.
    command: sh -c "npx prisma generate && npm run dev"
    volumes:
      - ./server/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: dev
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
    volumes:
      - ./client/src:/app/src
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
