# Production compose. Differs from docker-compose.yml (dev) in:
#   - restart: unless-stopped on long-running services
#   - no bind-mount of src/ (image is authoritative)
#   - server/client commands run the compiled output, not nodemon/next-dev
#   - every secret comes from the environment; fails fast if missing
#   - healthcheck on the server so orchestrators can detect DB-down
#
# Usage:
#   1. Copy server/.env.example to server/.env.prod and fill in real values.
#   2. export $(grep -v '^#' server/.env.prod | xargs) (or use docker-compose --env-file)
#   3. docker compose -f docker-compose.prod.yml up -d --build
#   4. First deploy only: docker compose -f docker-compose.prod.yml exec server npx prisma migrate deploy
#
# For a managed Postgres (RDS / Cloud SQL / Neon), delete the `db` service
# and point DATABASE_URL at the managed instance. Consider Multi-AZ and
# automated backups at that point.

# Image pinning policy:
#   Major-only tags (`postgres:16-alpine`) silently track the upstream
#   floating tag, so a rebuild months later can land a different base.
#   Pin to a specific minor (`postgres:16.6-alpine`) here; for reproducible
#   builds across the deployment fleet, replace the tag with a digest in
#   CI: `postgres:16.6-alpine@sha256:<digest>`. Refresh quarterly to pick
#   up upstream patches.
services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port publish in prod — only the server container talks to it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # Backs BullMQ for Square Catalog sync. AOF persistence on so a crash
    # doesn't drop in-flight sync jobs (the alternative is silent listing
    # drift between marketplace and Square POS until reconciliation runs).
    # If you're running on Railway / Render, replace this with a managed
    # Redis and point REDIS_URL at it; the rest of the stack is agnostic.
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      target: runner
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_PASS: ${SMTP_PASS:?SMTP_PASS is required}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Square uses connected accounts (OAuth) only. Legacy platform-level
      # SQUARE_ACCESS_TOKEN / SQUARE_LOCATION_ID / SQUARE_WEBHOOK_* removed
      # 2026-05-01 with the deprecated /api/webhooks/square handler.
      SQUARE_ENV: ${SQUARE_ENV:-production}
      SQUARE_OAUTH_STATE_SECRET: ${SQUARE_OAUTH_STATE_SECRET:-}
      SQUARE_APPLICATION_ID: ${SQUARE_APPLICATION_ID:-}
      SQUARE_APPLICATION_SECRET: ${SQUARE_APPLICATION_SECRET:-}
      # Square Catalog sync (per-seller two-way + public Featured rail).
      # When unset, the catalog sync feature is disabled; the marketplace
      # itself keeps working.
      SQUARE_FEATURED_ACCESS_TOKEN: ${SQUARE_FEATURED_ACCESS_TOKEN:-}
      SQUARE_FEATURED_LOCATION_ID: ${SQUARE_FEATURED_LOCATION_ID:-}
      SQUARE_CATALOG_WEBHOOK_SIGNATURE_KEY: ${SQUARE_CATALOG_WEBHOOK_SIGNATURE_KEY:-}
      SQUARE_CATALOG_WEBHOOK_URL: ${SQUARE_CATALOG_WEBHOOK_URL:-}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required for the catalog sync queue}
      PAYMENT_TOKEN_ENCRYPTION_KEY: ${PAYMENT_TOKEN_ENCRYPTION_KEY:?PAYMENT_TOKEN_ENCRYPTION_KEY is required}
      # Observability: Sentry server-side (no-op when DSN unset).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # Prometheus scrape token. Set this AND configure your scraper's
      # bearer auth to the same value. Leave unset to disable /metrics.
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: ./client
      target: runner
      args:
        # Baked into the client bundle at build time — must be the
        # public-facing API URL, not the internal compose service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
